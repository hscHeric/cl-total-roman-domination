[tools]
cmake = "4.5.0"
conan = "latest"
ninja = "1.13.2"
pipx = "1.18.16"
python = "3.15.2"

[env]
_.python.venv = { path = ".venv", create = true }
PROJECT_ROOT = "{{cwd}}"

[tasks.dataset]
description = "Auto dataset pipeline: reproduces from metadata.json if present, otherwise generates a brand-new dataset from scratch, copies to dataset/processed/, and verifies SHA-256"
run = "python scripts/instances/reproduce_dataset.py --auto"

[tasks."dataset:reproduce"]
description = "Reproduce exact benchmark dataset from versioned metadata.json (download/generate with saved seeds, convert, filter, select, copy to dataset/processed/, verify SHA-256)"
run = "python scripts/instances/reproduce_dataset.py"

[tasks."dataset:generate"]
description = "Generate a brand-new dataset from scratch (download/convert real datasets, generate synthetic datasets with fresh random seeds, filter, select 30 per family, copy instances + metadata.json + selection.csv to dataset/processed/, verify SHA-256)"
run = "python scripts/instances/reproduce_dataset.py --fresh"

[tasks."dataset:reproduce:synthetic"]
description = "Reproduce only the 4 synthetic datasets from metadata.json and verify SHA-256"
run = "python scripts/instances/reproduce_dataset.py --synthetic-only"

[tasks."dataset:reproduce:real"]
description = "Reproduce only the 4 real/benchmark datasets from metadata.json and verify SHA-256"
run = "python scripts/instances/reproduce_dataset.py --real-only"

[tasks."dataset:verify"]
description = "Verify SHA-256 checksums of all selected .col instances in dataset/processed/ against metadata.json"
run = "python scripts/instances/reproduce_dataset.py --verify-only"


